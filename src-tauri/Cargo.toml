[package]
name = "easydevterm-app"
version = "0.1.0"
edition = "2021"
description = "Multi-session serial/telnet/ssh terminal for router development"
default-run = "easydevterm-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
log = "0.4"
env_logger = "0.11"
serialport = { version = "4", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_UI",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Iteration profile: no LTO, parallel codegen, no strip -> much faster builds.
# Final distributable still builds with `--release`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false
